services:
  postgres:
    image: postgres:17-alpine
    container_name: endoora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ENDOORA_DB_NAME:-endoora}
      POSTGRES_USER: ${ENDOORA_DB_USER:-endoora}
      POSTGRES_PASSWORD: ${ENDOORA_DB_PASSWORD:-endoora_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - endoora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENDOORA_DB_USER:-endoora} -d ${ENDOORA_DB_NAME:-endoora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: endoora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - endoora_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  endoora_postgres_data:
  endoora_redis_data:
