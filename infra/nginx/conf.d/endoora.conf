# Upstream definitions for Endoora services
upstream web_upstream {
    server web:3000;
    keepalive 32;
}

upstream api_upstream {
    server api:8000;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name endoora.ir www.endoora.ir api.endoora.ir;

    # Let's Encrypt ACME challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name endoora.ir www.endoora.ir;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/endoora.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/endoora.ir/privkey.pem;

    # TLS Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # =========================================================================
    # CRITICAL NATIONAL NETWORK (NET MELLI) CONFIGURATION:
    # Foreign OCSP responders (like Let's Encrypt r3.o.lencr.org) are unreachable
    # during international internet cutoffs. If ssl_stapling is enabled with strict
    # verification, the TLS handshake may stall or fail entirely for domestic clients.
    # We explicitly disable OCSP stapling here to guarantee uninterrupted connections.
    # =========================================================================
    ssl_stapling off;
    ssl_stapling_verify off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 25M;

    # Next.js Static Chunks (immutable, aggressive 1-year cache to survive network degradation)
    location /_next/static/ {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Embedded Self-hosted Fonts
    location /fonts/ {
        proxy_pass http://web_upstream;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # Static Media & Icons
    location ~* \.(?:ico|png|jpg|jpeg|svg|webp|webm|mp3|wav|ogg|webmanifest)$ {
        proxy_pass http://web_upstream;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Service Worker (must NEVER be cached permanently so PWA updates immediately)
    location = /sw.js {
        proxy_pass http://web_upstream;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Backend Django REST API & Admin
    location ~ ^/(api|backend|admin)/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend Next.js Application
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for HMR / live events
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
