name: Endoora CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: endoora
          POSTGRES_USER: endoora
          POSTGRES_PASSWORD: endoora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U endoora -d endoora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENDOORA_ENV: test
      ENDOORA_TIMEZONE: Asia/Tehran
      ENDOORA_DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      ENDOORA_DEBUG: "0"
      ENDOORA_ALLOWED_HOSTS: localhost,127.0.0.1
      ENDOORA_DB_NAME: endoora
      ENDOORA_DB_USER: endoora
      ENDOORA_DB_PASSWORD: endoora_ci
      ENDOORA_DB_HOST: 127.0.0.1
      ENDOORA_DB_PORT: "5432"
      ENDOORA_REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_SETTINGS_MODULE: endoora_api.settings.test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: apps/api/.python-version
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.9"
      - run: python scripts/scan_secrets.py
